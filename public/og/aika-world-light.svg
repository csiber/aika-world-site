<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AIKA: World – living simulation</title>
  <desc id="desc">Open graph kártya világos témával az AIKA: World projekt számára.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff" />
      <stop offset="50%" stop-color="#e2dcff" />
      <stop offset="100%" stop-color="#d4efff" />
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#7b53ff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#7b53ff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" rx="48" />
  <g transform="translate(0 0)">
    <circle cx="880" cy="280" r="220" fill="url(#orb)" />
    <circle cx="320" cy="400" r="180" fill="url(#orb)" opacity="0.4" />
    <circle cx="1040" cy="120" r="90" fill="#7b53ff" opacity="0.18" />
  </g>
  <g transform="translate(120 180)" fill="#120c2b">
    <text font-family="'Geist', 'Inter', 'Arial', sans-serif" font-size="88" font-weight="700" letter-spacing="12" textLength="700">
      AIKA: WORLD
    </text>
    <text y="120" font-family="'Geist', 'Inter', 'Arial', sans-serif" font-size="30" font-weight="500" fill="#2f2378">
      Living simulation by SyncNode
    </text>
    <text y="180" font-family="'Geist', 'Inter', 'Arial', sans-serif" font-size="26" font-weight="400" fill="#3b2a9b" opacity="0.85">
      Emergent AI civilisations · Collaborative storytelling · Cloudflare Workers stack
    </text>
  </g>
  <g transform="translate(120 420)" fill="#2f2378">
    <rect x="0" y="0" width="320" height="4" rx="2" fill="#7b53ff" />
    <text y="52" font-family="'Geist Mono', 'IBM Plex Mono', monospace" font-size="22" letter-spacing="8">
      https://aika.world
    </text>
  </g>
</svg>
