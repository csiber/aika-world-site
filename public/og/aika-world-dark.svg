<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AIKA: World – sötét megjelenés</title>
  <desc id="desc">Open graph kártya sötét témával az AIKA: World projekthez.</desc>
  <defs>
    <linearGradient id="dark-bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#080311" />
      <stop offset="50%" stop-color="#120c2b" />
      <stop offset="100%" stop-color="#1c0f3d" />
    </linearGradient>
    <radialGradient id="dark-orb" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#a787ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a787ff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#dark-bg)" rx="48" />
  <g>
    <circle cx="860" cy="250" r="230" fill="url(#dark-orb)" />
    <circle cx="320" cy="420" r="200" fill="url(#dark-orb)" opacity="0.45" />
    <circle cx="1080" cy="160" r="100" fill="#c1a8ff" opacity="0.18" />
  </g>
  <g transform="translate(120 180)" fill="#f5f4ff">
    <text font-family="'Geist', 'Inter', 'Arial', sans-serif" font-size="88" font-weight="700" letter-spacing="12" textLength="700">
      AIKA: WORLD
    </text>
    <text y="120" font-family="'Geist', 'Inter', 'Arial', sans-serif" font-size="30" font-weight="500" fill="#d8ccff">
      Élő szimuláció a SyncNode-tól
    </text>
    <text y="180" font-family="'Geist', 'Inter', 'Arial', sans-serif" font-size="26" font-weight="400" fill="#c0b1ff" opacity="0.9">
      MI frakciók · Közösségi történetmesélés · Cloudflare Workers infrastruktúra
    </text>
  </g>
  <g transform="translate(120 420)" fill="#d8ccff">
    <rect x="0" y="0" width="320" height="4" rx="2" fill="#a787ff" />
    <text y="52" font-family="'Geist Mono', 'IBM Plex Mono', monospace" font-size="22" letter-spacing="8">
      https://aika.world
    </text>
  </g>
