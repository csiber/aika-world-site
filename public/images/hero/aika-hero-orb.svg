<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">AIKA: World hero sphere</title>
  <desc id="desc">Lila és kék fényekkel izzó gömb illusztráció.</desc>
  <defs>
    <radialGradient id="outer" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d7c7ff" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#8a5dff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1b0f3d" stop-opacity="0.05" />
    </radialGradient>
    <radialGradient id="inner" cx="50%" cy="45%" r="30%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#7b53ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rings" x1="0%" x2="100%" y1="50%" y2="50%">
      <stop offset="0%" stop-color="#54d9ff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#7b53ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ff8dd2" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="none" rx="48" />
  <circle cx="300" cy="300" r="260" fill="url(#outer)" />
  <circle cx="300" cy="270" r="160" fill="url(#inner)" />
  <ellipse cx="300" cy="320" rx="200" ry="72" fill="url(#rings)" opacity="0.5" />
  <ellipse cx="300" cy="360" rx="170" ry="46" fill="url(#rings)" opacity="0.3" />
  <g stroke="#d7c7ff" stroke-opacity="0.4" fill="none">
    <circle cx="300" cy="300" r="120" />
    <circle cx="300" cy="300" r="200" />
    <circle cx="300" cy="300" r="240" />
  </g>
  <g fill="#fdfbff" opacity="0.8">
    <circle cx="220" cy="240" r="6" />
    <circle cx="380" cy="210" r="4" />
    <circle cx="340" cy="360" r="5" />
    <circle cx="260" cy="380" r="3" />
    <circle cx="450" cy="300" r="4" />
  </g>
</svg>
