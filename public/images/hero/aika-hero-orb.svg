      <stop offset="45%" stop-color="#1b3a70" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06030f" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="100%">
