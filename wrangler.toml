name = "aika-colony"
main = "worker/src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Serve the built Vue app as static assets
[assets]
directory = "./frontend/dist"

[vars]
ENVIRONMENT = "production"

# D1 Database
[[d1_databases]]
binding = "aika_colony_db"
database_name = "aika-colony-db"
database_id = "74736f06-e68b-4872-99e9-4a11b8eb1048"

# Secrets (set via: wrangler secret put JWT_SECRET)
# JWT_SECRET — a long random string, e.g. openssl rand -hex 32

# Custom domain (optional)
# [[routes]]
# pattern = "aikacolony.yourdomain.com/*"
# zone_name = "yourdomain.com"

[env.preview]
name = "aika-colony-preview"
[env.preview.vars]
ENVIRONMENT = "preview"
