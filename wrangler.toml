name = "aika-colony"
main = "worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Rules to bundle static HTML as a module import
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[vars]
ENVIRONMENT = "production"

# Optional: Custom domain routing
# [[routes]]
# pattern = "aikacolony.example.com/*"
# zone_name = "example.com"

# Optional: KV namespace for future game state persistence
# [[kv_namespaces]]
# binding = "GAME_STATE"
# id = "YOUR_KV_NAMESPACE_ID"
# preview_id = "YOUR_PREVIEW_KV_NAMESPACE_ID"
