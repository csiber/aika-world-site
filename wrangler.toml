name = "aika-world"
main = "worker/src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Serve the built Vue app as static assets
[assets]
directory = "./frontend/dist"

[vars]
ENVIRONMENT = "production"
TURNSTILE_SECRET = "0x4AAAAAACjkTSOlxZq6QAcbdOBQfdtmOAE"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "aika-world-db"
database_id = "9857d534-0700-427a-aab7-592e1fe95dbf"

# Secrets (set via: wrangler secret put JWT_SECRET)
# JWT_SECRET        — a long random string, e.g. openssl rand -hex 32
# OPENROUTER_API_KEY — OpenRouter API key (ingyenes: openrouter.ai)

# Custom domain (optional)
# [[routes]]
# pattern = "aikaworld.yourdomain.com/*"
# zone_name = "yourdomain.com"

[env.preview]
name = "aika-world-preview"
[env.preview.vars]
ENVIRONMENT = "preview"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
